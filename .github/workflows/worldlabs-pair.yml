name: Read existing world comparison assets
run-name: Retrieve already-exported vertex-colored meshes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-asset-compare-readonly
  cancel-in-progress: false

jobs:
  retrieve-existing-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Myenv
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Read existing metadata and download exported assets
        env:
          WORLDLABS_API_KEY: ${{ secrets.WORLDLABS_API_KEY }}
        run: python scripts/retrieve_world_comparison_assets.py
      - name: Preserve only the requested GLBs and URL-free manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-asset-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            world-asset-comparison/water-courtyard-vertex-colored.glb
            world-asset-comparison/neutral-daylight-atrium-vertex-colored.glb
            world-asset-comparison/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
