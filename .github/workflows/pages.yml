name: Deploy static editor demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.pages_enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Python for the synthetic demo fixture
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Check whether Pages publishing is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/', 1)
          base_path = '/' if name.lower() == f'{owner.lower()}.github.io' else f'/{name}/'
          request = Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{repository}/pages",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urlopen(request, timeout=30) as response:
                  site = json.load(response)
              enabled = site.get('build_type') == 'workflow'
          except HTTPError as error:
              if error.code != 404:
                  print(f'::error::Could not read GitHub Pages settings (HTTP {error.code}). Check repository Pages permissions; publishing status was not assumed.')
                  raise SystemExit(1)
              enabled = False
          except URLError:
              print('::error::Could not reach the GitHub Pages API. Publishing status was not assumed.')
              raise SystemExit(1)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"pages_enabled={str(enabled).lower()}\nbase_path={base_path}\n")
          if not enabled:
              settings = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/settings/pages"
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(
                      '### Static demo build; publishing is not enabled\n\n'
                      'This run will test and upload the browser demo as a reviewable `github-pages` artifact. '
                      f'To publish it, open [Settings → Pages]({settings}), '
                      'set **Source** to **GitHub Actions**, and re-run this workflow. '
                      'The workflow does not change repository hosting settings.\n'
                  )
          PY
      - name: Configure Pages
        id: pages
        if: steps.pages_status.outputs.pages_enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install editor dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Test editor
        run: npm test --prefix web
      - name: Build the browser-only demo
        run: npm run build:demo --prefix web
        env:
          VITE_BASE_PATH: ${{ steps.pages_status.outputs.pages_enabled == 'true' && format('{0}/', steps.pages.outputs.base_path) || steps.pages_status.outputs.base_path }}
      - name: Upload only the static editor bundle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
