      <div id="gesso-boot-message">
        <p id="gesso-boot-label">opening gesso</p>
        <a id="gesso-boot-retry" href="" hidden>reload page</a>
      </div>
      <noscript><p style="position:absolute;bottom:24px;width:100%">Enable JavaScript to open gesso.</p></noscript>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const shell=document.getElementById('gesso-boot');
        const label=document.getElementById('gesso-boot-label');
        const retry=document.getElementById('gesso-boot-retry');
        const studio=location.pathname==='/';
        label.textContent=studio?'opening studio':'opening gesso';
        retry.href=location.href;
        retry.addEventListener('click',event=>{event.preventDefault();location.reload();});
        const failed=()=>{
          shell.setAttribute('aria-busy','false');
          shell.setAttribute('role','alert');
          label.textContent=studio?'couldn’t open studio':'couldn’t open gesso';
          retry.hidden=false;
        };
        const scriptFailed=event=>{if(event.target instanceof HTMLScriptElement&&event.target.type==='module')failed();};
        window.addEventListener('error',scriptFailed,true);
        window.addEventListener('gesso:boot-error',failed);
        window.addEventListener('gesso:boot-complete',()=>{
          window.removeEventListener('error',scriptFailed,true);
          window.removeEventListener('gesso:boot-error',failed);
        },{once:true});
      })();
    </script>
    <script id="gesso-entry" type="module" src="/src/main.tsx"></script>
